<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>kala — Extension settings</title>
    <link rel="icon" href="/icons/icon-32.png" />
    <style>
      :root {
        color-scheme: light dark;
        --primary: #5b5bd6;
        --bg: #f7f7f9;
        --paper: #ffffff;
        --text: rgba(0, 0, 0, 0.87);
        --text-2: rgba(0, 0, 0, 0.6);
        --divider: rgba(0, 0, 0, 0.23);
        --error: #d32f2f;
        --ok: #2e7d32;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --primary: #9b9bf4;
          --bg: #111114;
          --paper: #18181c;
          --text: #ffffff;
          --text-2: rgba(255, 255, 255, 0.7);
          --divider: rgba(255, 255, 255, 0.23);
          --error: #f44336;
          --ok: #66bb6a;
        }
      }
      body {
        margin: 0;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px;
        background: var(--paper);
        border-radius: 8px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        color: var(--primary);
      }
      p {
        margin: 0 0 16px;
        color: var(--text-2);
      }
      label {
        display: block;
        margin-bottom: 16px;
        font-weight: 500;
      }
      input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid var(--divider);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 400;
      }
      input:focus {
        outline: 2px solid var(--primary);
        outline-offset: -1px;
      }
      button {
        padding: 6px 16px;
        border: 0;
        border-radius: 6px;
        background: var(--primary);
        color: var(--paper);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      a {
        color: var(--primary);
        cursor: pointer;
      }
      code {
        font-family: ui-monospace, monospace;
      }
      .status {
        margin: 12px 0 0;
      }
      .ok {
        color: var(--ok);
      }
      .err {
        color: var(--error);
      }
      hr {
        margin: 24px 0 16px;
        border: 0;
        border-top: 1px solid var(--divider);
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="/src/options/options.tsx"></script>
  </body>
</html>
