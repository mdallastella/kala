name: extension

# Releases the Chrome extension to the Chrome Web Store: push a tag ext-vX.Y.Z
# whose version matches extension/public/manifest.json. The item must already
# exist (the API cannot create one); see README.md "Releasing to the Chrome Web Store".
on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:

concurrency:
  group: extension-release
  cancel-in-progress: false

env:
  CWS_API: https://chromewebstore.googleapis.com
  ZIP: kala-extension.zip

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        run: |
          manifest=$(jq -r .version public/manifest.json)
          pkg=$(jq -r .version package.json)
          if [ "$manifest" != "$pkg" ]; then
            echo "::error::manifest.json ($manifest) and package.json ($pkg) versions differ"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#ext-v}" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi
          echo "Releasing version $manifest"

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # manifest.json must sit at the root of the ZIP.
      - name: Package
        run: cd dist && zip -r "$GITHUB_WORKSPACE/$ZIP" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kala-extension
          path: ${{ env.ZIP }}

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and publish
        working-directory: .
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          ITEM: ${{ env.CWS_API }}/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_ITEM_ID }}
          UPLOAD: ${{ env.CWS_API }}/upload/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_ITEM_ID }}
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$@"; }

          echo "Uploading $ZIP"
          res=$(api -X POST -H "Content-Type: application/zip" --data-binary "@$ZIP" "$UPLOAD:upload")
          echo "$res"
          state=$(jq -r '.uploadState // empty' <<<"$res")

          for _ in $(seq 1 12); do
            [ "$state" = IN_PROGRESS ] || break
            sleep 5
            res=$(api "$ITEM:fetchStatus")
            echo "$res"
            state=$(jq -r '.lastAsyncUploadState // .uploadState // empty' <<<"$res")
          done

          if [ "$state" != SUCCEEDED ]; then
            echo "::error::upload ended in state '${state:-unknown}'"
            exit 1
          fi

          echo "Submitting for review"
          api -X POST "$ITEM:publish"
          echo

          {
            echo '### Chrome Web Store status'
            echo '```json'
            api "$ITEM:fetchStatus" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
